[package]
name = "everykill"
version = "0.1.0"
edition = "2021"
description = "The CLI tool to kill all dependency folders. No, really - all of them."
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.27"
dirs = "5.0"
glob = "0.3"
ratatui = "0.30"
rayon = "1.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.4"

[dev-dependencies]
tempfile = "3.10"
